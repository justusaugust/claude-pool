name: Tests

on:
  # Feature branches are tested by their pull_request run; push runs only on main,
  # so each PR runs once instead of twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated Python fixture tests
        run: python3 scripts/test.py

  mods:
    name: Native Mod fixtures on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set Native download cache path
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/claude-pool-mod-npm" >> "$GITHUB_ENV"
      - name: Cache Native package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-mods-npm-node22-claude2.1.301-v1
      - name: Install pinned Native Claude in the runner's temporary directory
        run: npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@2.1.301
      - name: Test all generated Mods with phone controls off and on
        run: python3 scripts/test_mods.py --native-claude "$RUNNER_TEMP/claude-code/node_modules/.bin/claude"

  install:
    name: Clean install and update on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Identify runner image and dependency cache paths
        id: image
        run: |
          printf 'version=%s\n' "${ImageVersion:?}" >> "$GITHUB_OUTPUT"
          echo "CARGO_HOME=$RUNNER_TEMP/claude-pool-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/claude-pool-target" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/claude-pool-install-npm" >> "$GITHUB_ENV"
      - name: Cache build dependencies only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-install-node22-claude2.1.301-v1-${{ hashFiles('backend/upstream.json', 'backend/shunt.patch', 'scripts/build_backend.py') }}
      - name: Install pinned Native Claude in the runner's temporary directory
        run: npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@2.1.301
      - name: Build, install and update with a retained worker
        run: |
          test ! -e gateway/bin/shunt
          test ! -e "$CARGO_TARGET_DIR/release/shunt"
          python3 scripts/smoke_install_update.py --native-claude "$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          test ! -e "$CARGO_TARGET_DIR/release/shunt"

  required-python-311:
    name: Python 3.11
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg of python to pass
        env:
          RESULT: ${{ needs.python.result }}
        run: test "$RESULT" = success

  required-python-314:
    name: Python 3.14
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg of python to pass
        env:
          RESULT: ${{ needs.python.result }}
        run: test "$RESULT" = success

  required-mods:
    name: Native Mod fixtures
    needs: mods
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg of mods to pass
        env:
          RESULT: ${{ needs.mods.result }}
        run: test "$RESULT" = success

  required-install:
    name: Clean install and update
    needs: install
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg of install to pass
        env:
          RESULT: ${{ needs.install.result }}
        run: test "$RESULT" = success
